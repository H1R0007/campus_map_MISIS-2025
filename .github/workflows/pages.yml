name: web
on:
push:
branches: [ features_Mish ]
workflow_dispatch:

permissions:
contents: read
pages: write
id-token: write

concurrency:
group: "pages"
cancel-in-progress: true

jobs:
build:
runs-on: ubuntu-latest
steps:
- uses: actions/checkout@v4

  # Устанавливаем Emscripten
  - uses: mymindstorm/setup-emsdk@v14
    with:
      version: 3.1.57

  # Конфигурируем (emscripten-генератор) и собираем
  - name: Configure (Emscripten)
    run: emcmake cmake -S . -B build/web -DCMAKE_BUILD_TYPE=Release
  - name: Build
    run: cmake --build build/web -j

  # Публикуем артефакты для Pages
  - name: Upload artifact
    uses: actions/upload-pages-artifact@v3
    with:
      path: build/web
deploy:
runs-on: ubuntu-latest
needs: build
environment:
name: github-pages
url: ${{ steps.deployment.outputs.page_url }}
steps:
- id: deployment
uses: actions/deploy-pages@v4
