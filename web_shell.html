<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Campus Map MISIS 2025</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        /* === Общая стилистика === */
        body {
            margin: 0;
            font-family: 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* === HEADER === */
        header {
            background: #003366;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            height: 56px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.2);
        }

        .logo {
            display: flex;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

            .logo img {
                height: 28px;
                margin-right: 8px;
            }

        .search-bar {
            flex: 1;
            margin: 0 20px;
            position: relative;
        }

            .search-bar input {
                width: 100%;
                padding: 6px 32px 6px 10px;
                border-radius: 4px;
                border: none;
                font-size: 14px;
            }

            .search-bar i {
                position: absolute;
                right: 10px;
                top: 7px;
                color: #666;
            }

        .header-controls button {
            margin-left: 8px;
            background: #0073e6;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

            .header-controls button:hover {
                background: #005bb5;
            }

        /* === LAYOUT === */
        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        /* === SIDEBAR (выезжающий) === */
        .sidebar {
            position: fixed;
            top: 56px; /* под header */
            left: -280px; /* спрятано за экраном */
            width: 280px;
            height: calc(100% - 56px);
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-right: 1px solid #ccc;
            padding: 16px;
            box-shadow: 2px 0 6px rgba(0,0,0,0.2);
            transition: left 0.3s ease;
            z-index: 9;
            overflow-y: auto;
        }

            .sidebar.open {
                left: 0;
            }
            /* активное состояние */

            .sidebar h3 {
                margin-top: 0;
            }

            .sidebar ul {
                list-style: none;
                padding: 0;
            }

            .sidebar li {
                margin: 8px 0;
                cursor: pointer;
            }

                .sidebar li:hover {
                    color: #0073e6;
                }

        /* === Canvas area === */
        .map-area {
            flex: 1;
            position: relative;
            background: #222;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
            background: black;
        }

        /* Floating buttons (zoom +) */
        .map-controls {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .map-controls button {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: none;
                background: white;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                font-size: 18px;
                cursor: pointer;
            }

                .map-controls button:hover {
                    background: #f0f0f0;
                }

        /* === FOOTER === */
        footer {
            background: #003366;
            color: white;
            text-align: center;
            padding: 6px;
            font-size: 12px;
        }
            footer a {
                color: #66b2ff;
                text-decoration: none;
                margin-left: 8px;
            }

                footer a:hover {
                    text-decoration: underline;
                }

        .main {
            flex: 1;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 250px;
            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(8px);
            border-right: 1px solid #ddd;
            padding: 16px;
            overflow-y: auto;
        }

            .sidebar h3 {
                margin-top: 0;
            }

            .sidebar ul {
                list-style: none;
                padding: 0;
            }

            .sidebar li {
                margin: 8px 0;
                cursor: pointer;
            }

                .sidebar li:hover {
                    color: #0073e6;
                }

        .map-area {
            flex: 1;
            position: relative;
            background: #222;
        }

        #canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        .map-controls {
            position: absolute;
            right: 12px;
            bottom: 12px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

            .map-controls button {
                width: 40px;
                height: 40px;
                border-radius: 50%;
                border: none;
                background: white;
                box-shadow: 0 2px 6px rgba(0,0,0,0.2);
                font-size: 18px;
                cursor: pointer;
            }

                .map-controls button:hover {
                    background: #f0f0f0;
                }

    </style>
</head>
<body>
    <header>
        <div class="logo">
            <img src="logo.png" alt="Logo" />
            <span>Campus Map Navigator</span>
        </div>

        <div class="search-bar">
            <input type="text" placeholder="Поиск аудитории или места..." />
            <i>🔍</i>
        </div>

        <div class="header-controls">
            <button onclick="toggleLanguage()">RU/EN</button>
            <button onclick="toggleFullscreen()">⛶</button>
        </div>
    </header>

    <div class="main">
        <aside class="sidebar">
            <h3>Избранное</h3>
            <ul>
                <li>📚 Библиотека</li>
                <li>🍽 Столовая</li>
                <li>🏃‍♂️ Спортзал</li>
            </ul>
        </aside>

        <div class="map-area">
            <canvas id="canvas"></canvas>
            <div class="map-controls">
                <button onclick="zoomIn()">+</button>
                <button onclick="zoomOut()">-</button>
            </div>
        </div>
    </div>


    <footer>
        © MISIS Campus 2025 — Project demo
    </footer>

    <script>
        var Module = { canvas: document.getElementById('canvas') };

        function toggleFullscreen() {
            let canvas = document.getElementById('canvas');
            if (!document.fullscreenElement) {
                canvas.requestFullscreen();
            } else {
                document.exitFullscreen();
            }
        }
        function toggleLanguage() {
            alert("Здесь будет переключатель RU/EN 🙂");
        }
        function zoomIn() { console.log("Zoom in"); }
        function zoomOut() { console.log("Zoom out"); }
    </script>

    {{{ SCRIPT }}}
</body>
</html>
