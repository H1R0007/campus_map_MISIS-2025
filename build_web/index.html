<!doctypehtml><html lang=ru><head><meta charset=utf-8><title>Campus Map MISIS 2025</title><meta content="width=device-width,initial-scale=1"name=viewport><style>body{margin:0;font-family:'Segoe UI',Roboto,sans-serif;background:#f5f7fa;color:#333;display:flex;flex-direction:column;height:100vh}header{background:#036;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:56px;box-shadow:0 2px 6px rgba(0,0,0,.2)}.logo{display:flex;align-items:center;font-weight:700;font-size:18px}.logo img{height:28px;margin-right:8px}.search-bar{flex:1;margin:0 20px;position:relative}.search-bar input{width:100%;padding:6px 32px 6px 10px;border-radius:4px;border:none;font-size:14px}.search-bar i{position:absolute;right:10px;top:7px;color:#666}.header-controls button{margin-left:8px;background:#0073e6;color:#fff;border:none;padding:6px 12px;border-radius:4px;cursor:pointer}.header-controls button:hover{background:#005bb5}.main{flex:1;display:flex;overflow:hidden}.sidebar{position:fixed;top:56px;left:-280px;width:280px;height:calc(100% - 56px);background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-right:1px solid #ccc;padding:16px;box-shadow:2px 0 6px rgba(0,0,0,.2);transition:left .3s ease;z-index:9;overflow-y:auto}.sidebar.open{left:0}.sidebar h3{margin-top:0}.sidebar ul{list-style:none;padding:0}.sidebar li{margin:8px 0;cursor:pointer}.sidebar li:hover{color:#0073e6}.map-area{flex:1;position:relative;background:#222}#canvas{width:100%;height:100%;display:block;background:#000}.map-controls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}.map-controls button{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:18px;cursor:pointer}.map-controls button:hover{background:#f0f0f0}footer{background:#036;color:#fff;text-align:center;padding:6px;font-size:12px}footer a{color:#66b2ff;text-decoration:none;margin-left:8px}footer a:hover{text-decoration:underline}.main{flex:1;display:flex;overflow:hidden}.sidebar{width:250px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-right:1px solid #ddd;padding:16px;overflow-y:auto}.sidebar h3{margin-top:0}.sidebar ul{list-style:none;padding:0}.sidebar li{margin:8px 0;cursor:pointer}.sidebar li:hover{color:#0073e6}.map-area{flex:1;position:relative;background:#222}#canvas{width:100%;height:100%;display:block}.map-controls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}.map-controls button{width:40px;height:40px;border-radius:50%;border:none;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);font-size:18px;cursor:pointer}.map-controls button:hover{background:#f0f0f0}.route-bar{position:absolute;top:70px;left:50%;transform:translateX(-50%);z-index:15;display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-radius:50px;box-shadow:0 4px 10px rgba(0,0,0,.15);padding:8px 14px}.route-bar label{font-weight:600;font-size:14px;color:#036}.route-bar input{flex:1;border:1px solid #ccc;border-radius:20px;padding:6px 12px;font-size:14px;min-width:180px;outline:0}.route-bar input:focus{border-color:#0073e6;box-shadow:0 0 4px rgba(0,115,230,.5)}.route-bar button{background:#0073e6;color:#fff;border:none;border-radius:20px;padding:6px 14px;font-size:14px;cursor:pointer;transition:background .2s ease}.route-bar button:hover{background:#005bb5}#errorBox{position:absolute;top:115px;left:50%;transform:translateX(-50%);color:red;font-size:13px;font-weight:600;background:rgba(255,255,255,.9);padding:4px 10px;border-radius:6px}</style></head><body><header><div class=logo><img alt=Logo src=logo.png> <span>Campus Map Navigator</span></div><div class=search-bar><input placeholder="Поиск аудитории или места..."></div><div class=header-controls><button onclick=toggleLanguage()>RU/EN</button> <button onclick=toggleFullscreen()>⛶</button></div></header><div class=route-bar><label for=fromInput>Где вы:</label> <input placeholder="Введите точку отправления"id=fromInput> <label for=toInput>Куда вы:</label> <input placeholder="Введите пункт назначения"id=toInput> <button id=findPathBtn>Найти путь</button></div><div id=errorBox></div><div class=main><aside class=sidebar><h3>Избранное</h3><ul><li>Библиотека</li><li>Столовая</li><li>Спортзал</li></ul></aside><div class=map-area><canvas id=canvas></canvas><div class=map-controls><button onclick=zoomIn()>+</button> <button onclick=zoomOut()>-</button></div></div></div><footer>© MISIS Campus 2025 — Project demo</footer><script>var Module={canvas:document.getElementById("canvas")};function toggleFullscreen(){let e=document.getElementById("canvas");document.fullscreenElement?document.exitFullscreen():e.requestFullscreen()}function toggleLanguage(){alert("Здесь будет переключатель RU/EN")}function zoomIn(){console.log("Zoom in")}function zoomOut(){console.log("Zoom out")}</script><script>Module={onRuntimeInitialized(){const t=document.getElementById("findPathBtn"),e=document.getElementById("fromInput"),n=document.getElementById("toInput"),o=document.getElementById("errorBox");t.onclick=()=>{const t=e.value.trim(),l=n.value.trim();o.textContent="",t&&l?Module.ccall("build_path_from_js",null,["string","string"],[t,l]):o.textContent="Введите начальную и конечную точки."},Module.printErr=t=>{t.includes("not found")||t.includes("Ошибка")?o.textContent=t:console.error(t)}}}</script><script async src=index.js></script></body></html>
